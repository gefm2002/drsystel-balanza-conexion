<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balanza — Opción D · Web Serial API</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --txt:#e6edf3; --muted:#8b98a5; --line:#2a3540; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); display:flex; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:560px; }
  h1 { font-size:15px; font-weight:600; color:var(--muted); margin:0 0 16px; }
  h1 b { color:var(--txt); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .peso { font-size:64px; font-weight:700; text-align:center; letter-spacing:-1px; }
  .estado { text-align:center; font-size:15px; font-weight:600; margin-top:4px; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .verde .dot{background:#3fb950}.verde{color:#3fb950}
  .amarillo .dot{background:#d29922}.amarillo{color:#d29922}
  .rojo .dot{background:#f85149}.rojo{color:#f85149}
  .grid { display:flex; gap:12px; margin-top:18px; }
  .box { flex:1; background:#0f1620; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .box .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .box .v { font-size:18px; font-weight:600; margin-top:2px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:18px; gap:10px; }
  .hex { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--muted); word-break:break-all; }
  .ok{color:#3fb950;font-weight:700}.bad{color:#f85149;font-weight:700}
  button { background:#238636; color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover{background:#2ea043}
  button:disabled{background:#30363d;cursor:not-allowed}
  .log { margin-top:16px; background:#0a0e13; border:1px solid var(--line); border-radius:10px; padding:10px; height:150px; overflow:auto; font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#7d8590; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Opción D · <b>Web Serial API</b> — navegador habla directo al COM (Chrome/Edge)</h1>
  <div class="card">
    <div id="peso" class="peso">— kg</div>
    <div id="estado" class="estado rojo"><span class="dot"></span>Desconectado</div>
    <div class="grid">
      <div class="box"><div class="k">Tara</div><div id="tara" class="v">— kg</div></div>
      <div class="box"><div class="k">Neto</div><div id="neto" class="v">— kg</div></div>
    </div>
    <div class="row">
      <button id="conectar">Conectar balanza</button>
      <button id="desconectar" disabled>Desconectar</button>
      <span id="xor" class="hex">XOR —</span>
    </div>
    <div class="row"><span class="hex" id="hex">trama: —</span></div>
    <div id="log" class="log"></div>
  </div>
</div>
<script src="protocol.js"></script>
<script src="app.js"></script>
</body>
</html>
